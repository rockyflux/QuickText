name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15          # fail fast if a --smoke run deadlocks, instead of hanging to the 6h cap
    steps:
      - uses: actions/checkout@v7
        # fetch-depth: 0 for the tags. VersionFromGitTag in the csproj derives the version from
        # `git describe --tags`, and checkout clones shallow WITHOUT tags by default — so the
        # build would silently stamp VersionFallback instead of the release being built.
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # --minimum-expected-tests is Microsoft.Testing.Platform's own guard against a silent/partial
      # test run. A floor of 1 only catches zero tests; use a realistic floor so a broken adapter
      # that discovers a handful cannot pass. Raise this when adding tests, never lower it.
      # Do NOT add --nologo here: the .NET 10 SDK doesn't claim that option yet, so it gets forwarded
      # verbatim to the test app and kills the run (exit 5) before a single test is seen.
      - name: Test (Core)
        run: dotnet test --project tests/QuickText.Core.Tests -c Release --minimum-expected-tests 300
      - name: Build (App)
        run: dotnet build src/QuickText.App -c Release --nologo
      - name: Smoke (parse every window's XAML)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/QuickText.App/bin/Release -Recurse -Filter QuickText.exe | Select-Object -First 1
          if (-not $exe) { Write-Error 'QuickText.exe not found'; exit 1 }
          # Resolve the marker via the SAME API the app writes with (.NET Path.GetTempPath), so a
          # TMP-vs-TEMP divergence can't make the workflow look in a different directory than the app.
          $marker = Join-Path ([System.IO.Path]::GetTempPath()) 'quicktext-smoke.txt'
          Remove-Item $marker -ErrorAction SilentlyContinue
          $p = Start-Process $exe.FullName -ArgumentList '--smoke' -PassThru -Wait
          # The 'OK' marker the app writes is the reliable success signal; a WPF ExitCode can come back
          # $null via Start-Process, so only an EXPLICIT non-zero code counts as failure.
          $ok = (Test-Path $marker) -and ((Get-Content $marker -Raw).Trim() -eq 'OK')
          Write-Host "smoke: exit=$($p.ExitCode) marker=$ok"
          if (-not $ok -or ($p.ExitCode -and $p.ExitCode -ne 0)) { exit 1 }

  # One file, two jobs: `needs: test` is what makes a red tree unable to produce a release, and it
  # costs nothing extra because the same run already did the testing. Splitting this into ci.yml +
  # release.yml would lose that — `needs:` does not reach across workflow files.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write        # creating the Release
      id-token: write        # the attest step below: exchange an OIDC token to sign the provenance
      attestations: write    # ...and write that attestation back to the repo
    steps:
      - uses: actions/checkout@v7
        # fetch-depth: 0 for the tags. VersionFromGitTag in the csproj derives the version from
        # `git describe --tags`, and checkout clones shallow WITHOUT tags by default — so the
        # build would silently stamp VersionFallback instead of the release being built.
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish (single-file win-x64, with and without the .NET runtime)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''   # tag v1.0.0 -> assembly version 1.0.0
          # ⚠️ **原生命令的非零退出不会中断 pwsh**，所以每次 publish 之后都要显式判一次。
          # 少了这个判断，「第一个 publish 失败 + 第二个成功」会以绿灯收场，
          # release 里就少了自包含那份 zip —— 而更新器只认自包含那份，
          # 装好的应用于是永远拿不到更新，只能靠人看出来少了资产。
          # 同一条判据见 033-windowshuttle 的 ci.yml。
          dotnet publish src/QuickText.App -c Release -p:PublishProfile=win-x64 -p:Version=$v --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Both profiles share bin/obj and differ in runtimeconfig.json (self-contained pins the
          # framework); publishing the second straight after the first regenerates it correctly —
          # verified by running the framework-dependent exe with --smoke, so no rebuild is needed.
          dotnet publish src/QuickText.App -c Release -p:PublishProfile=win-x64-needs-dotnet10 -p:Version=$v --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package + SHA256
        shell: pwsh
        run: |
          # Two zips — the variant lives in the ZIP name, so unpacking either always leaves a clean
          # QuickText.exe instead of a name a portable install would keep forever.
          Compress-Archive -Path src/QuickText.App/bin/Release/publish/QuickText.exe -DestinationPath "QuickText-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path src/QuickText.App/bin/Release/publish-needs-dotnet10/QuickText.exe -DestinationPath "QuickText-${{ github.ref_name }}-win-x64-needs-dotnet10.zip"
          # Every downloadable asset gets a line — the two builds go to two different audiences, and
          # signing only one of them leaves the other group holding a file they cannot check.
          # THIS LINE IS THE ASSET LIST. The attest step below consumes this file rather than
          # repeating the paths, so adding an asset here carries the attestation with it; listing
          # them again over there is how a new asset ends up silently unsigned.
          # Format is shasum's: hex digest, a separating space, a mode flag (space = text,
          # '*' = binary), then the name — which is exactly what the two spaces below produce.
          # Encoding pinned to ascii so this does not depend on which PowerShell runs it: 5.1
          # defaults to a BOM that breaks line-by-line parsing of the first entry.
          # Write LF explicitly: Set-Content uses CRLF on Windows, and sha256sum -c treats the \r
          # as part of the file name, so every line fails on Linux/macOS/Git Bash.
          $lines = Get-FileHash *.zip, src/QuickText.App/bin/Release/publish-needs-dotnet10/QuickText.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) }
          [IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), ($lines -join "`n") + "`n", [Text.Encoding]::ASCII)
      # Signed build provenance, and the closest thing this project has to a code signature: the exe
      # is unsigned, so a downloader's only other signal is SmartScreen telling them it is unknown.
      # This lets them check the file actually came out of THIS repo's workflow rather than merely
      # "is unmodified" — the attestation lives on GitHub's side, not next to the asset it vouches
      # for, so replacing the release does not let an attacker replace the proof along with it.
      # Runs BEFORE the Release step on purpose: a failure here should mean no release at all,
      # rather than published assets whose provenance quietly went missing.
      # Fed the checksums file rather than a repeated list of paths — the asset list then lives in
      # exactly one place (the Get-FileHash above) and new assets are covered automatically.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: SHA256SUMS.txt
      - name: Compose release body
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $notesPath = "docs/release-notes/$tag.md"
          if (-not (Test-Path $notesPath)) {
            Write-Error "缺少发版说明 $notesPath，打 tag 前先写好该版本的更新要点。"
            exit 1
          }
          # -Raw：整份说明原样进正文。-Encoding utf8：中文说明不能靠系统猜编码，否则会变成乱码。
          $notes = (Get-Content $notesPath -Raw -Encoding utf8).TrimEnd()
          # 单引号 here-string：正文里有反引号，且 tag 已由 Actions 展开，不能再让 PowerShell 插值。
          $tail = @'
          **下载哪个**

          - `QuickText-${{ github.ref_name }}-win-x64.zip` — 内含 .NET 运行时，解压即用；拿不准、内网机、离线机、U 盘随身带就选它。
          - `QuickText-${{ github.ref_name }}-win-x64-needs-dotnet10.zip` — 同一个程序，只是不带运行时；需要电脑上已装 [.NET 10 桌面运行时](https://dotnet.microsoft.com/download/dotnet/10.0)。
          - `QuickText.exe` — 就是上面那个不含运行时的版本，只是没打包：点开即用，也可直接覆盖现有的 QuickText.exe 完成更新。缺运行时时 Windows 会自己提示下载。

          **校验下载** — 程序没有代码签名，两种校验方式任选：

          ```
          gh attestation verify <file> -R "$GITHUB_REPOSITORY"   # 证明由本仓库构建
          certutil -hashfile <file> SHA256                        # 与 SHA256SUMS.txt 比对
          ```
          '@
          # PowerShell 7 的 utf8 无 BOM；带 BOM 会在正文第一个标题前多一个怪字符。
          # 末尾换行故意保留：GitHub 在「完整更新日志」链接前会再插空行。
          # 去掉 CR：.gitattributes 按 LF 存，Windows 检出可能是 CRLF，不处理会混进正文。
          $body = "**更新内容**`n`n" + $notes + "`n`n" + $tail + "`n"
          Set-Content -Path release-body.md -Value ($body -replace "`r`n", "`n") -Encoding utf8 -NoNewline
      - name: Release
        # Major-version tag on purpose: `v3` moves with each patch, which is how fixes arrive without
        # anyone bumping anything. There is no Dependabot; check the major and its release notes
        # before a release.
        uses: softprops/action-gh-release@v3
        with:
          # The third asset is the framework-dependent build attached raw, straight from its publish
          # directory so it lands under its plain name: one click to download and run, and it drops
          # straight over an existing QuickText.exe to update. Only the small build gets that — a
          # bare bundled-runtime exe is what browsers and SmartScreen fight hardest, and a plain,
          # version-less name can only belong to one of the two.
          # Spelled out rather than globbed: the names match what the Package step just produced,
          # one line per asset, so nothing looks missing and nothing can be uploaded twice.
          files: |
            QuickText-${{ github.ref_name }}-win-x64.zip
            QuickText-${{ github.ref_name }}-win-x64-needs-dotnet10.zip
            src/QuickText.App/bin/Release/publish-needs-dotnet10/QuickText.exe
            SHA256SUMS.txt
          # 正文由上一步拼好：docs/release-notes/<tag>.md 是更新要点，下面再跟「下载哪个」。
          # 没有发版说明就不能发版（上一步会失败）。包怎么选写在发版页，不写进 README。
          # 不在这里或 README 写文件大小：每次构建都会变，发版页本身会显示真实大小。
          body_path: release-body.md
          generate_release_notes: true
      # 把 release 发布出去，并显式把 `releases/latest` 指到它，然后自己确认一遍。
      #
      # ⚠️ **显式给 make_latest 不是多此一举**：GitHub 在「草稿转成已发布」时**不会**重算
      # `releases/latest` 指向谁。2026-10-20 在 rclone-deck 上撞到过一次：release 已经是
      # `draft=false`、`prerelease=false`、`published_at` 也填上了，`releases/latest` 却仍
      # 返回旧版本，端点 `releases/latest/download/latest.json` 于是 404（旧 release 里没有
      # 那个文件）——已装的应用从此收不到更新。
      #
      # 判据是**看 API 指到谁**，不是看 release 的字段：字段全对而指针没挪，端点照样 404。
      # CDN 那层重定向会再滞后几分钟，属正常——这里判 API，不判 CDN。
      - name: 发布这个 release，并把 latest 指到它
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # ⚠️ **不能用 `releases/tags/<tag>` 找这条 release**：那个端点**不返回草稿**。
          # 草稿只能从 release 列表里捞——列表按创建时间倒序，新建的草稿总在第一页。
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                 --jq "first(.[] | select(.tag_name == \"${tag}\") | .id)")"
          if [ -z "$id" ]; then
            echo "::error::没找到 tag ${tag} 对应的 release"
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" \
            -F draft=false -f make_latest=true > /dev/null
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$tag" ]; then
            echo "::error::releases/latest 指着 ${latest}，不是 ${tag}"
            exit 1
          fi
          echo "release ${tag} 已发布，releases/latest 指向它"

      # --- winget ------------------------------------------------------------------------------
      # 清单不归这个仓管，归 rockbenben/winget-manifests：那边的 apps.json 是唯一源，
      # 巡检到新发版就重生成 manifest、往 winget-pkgs 开 PR。这个仓只管把发版发出去。
      #
      # 不要再在这里直接提交一份 manifest。两条路都往 winget-pkgs 开同一个包的 PR，
      # 第二个会被当重复拒掉，看起来就像「winget 坏了」。要改清单，改 apps.json 里那一项。
      # 原来的 wingetcreate update ... --submit 那段已经删掉了，原因就是这个。
      #
      # 清单只挂自包含 zip。winget 按架构 / 安装器类型 / 范围 / 语言挑安装包，
      # 「带不带 .NET 运行时」不在这些维度里；一份清单里塞两份构建，用户选不到第二份。
      # 三个资产里也只有它合适：裸 QuickText.exe 文件名没有版本号，winget 要求每个版本
      # 的安装包 URL 唯一。选自包含而不是依赖本机运行时，是因为 winget 的承诺就是
      # 「一条命令就能跑」；缺运行时表现成「装上了却打不开」，比下载大一点更难查。
      # 以后若要改成小包（可逆，用户下次 winget upgrade 就会跟上）：把清单指到
      # -needs-dotnet10 的 zip，并加上
      #   Dependencies: { PackageDependencies: [ { PackageIdentifier: Microsoft.DotNet.DesktopRuntime.10 } ] }
      # （源里已有该依赖；依赖处理已不是实验特性，但用户机上的旧 winget 仍可能不一样。）
      #
      # 首次收录也走流水线的 PR：上游还没有这个包的 manifest 时，它被当作「新包」，流水线会开
      # 那个 PR。但社区仓对新包有额外校验，第一次可能要人工跟一下。
